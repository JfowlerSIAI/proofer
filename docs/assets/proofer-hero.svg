<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
  <title id="title">Proofer. All local. All yours.</title>
  <desc id="desc">A Proofer blue wordmark on a deep ink background. All proofreading runs on your computer. No cloud fallback.</desc>
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#102540"/><stop offset="1" stop-color="#0b182b"/></linearGradient>
    <pattern id="rules" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#b3cced" stroke-opacity=".035"/></pattern>
  </defs>
  <rect width="1200" height="390" rx="18" fill="url(#surface)"/>
  <rect width="1200" height="390" rx="18" fill="url(#rules)"/>
  <image x="56" y="44" width="50" height="50" href="data:image/png;base64,"/>
  <text x="122" y="79" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="600" letter-spacing="-1" fill="#ffffff">Proofer</text>
  <text x="1129" y="73" text-anchor="end" font-family="Arial,Helvetica,sans-serif" font-size="15" letter-spacing="2" fill="#b5c6db">CHROME + BRAVE</text>
  <text x="53" y="226" font-family="Arial,Helvetica,sans-serif" font-size="96" font-weight="700" letter-spacing="-5" fill="#ffffff">All local. All yours.</text>
  <path d="M58 251C245 240 407 243 625 250" fill="none" stroke="#5697ff" stroke-width="4" stroke-linecap="round"/>
  <text x="58" y="310" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#c8d6e8">Your proofreading stays on your computer.</text>
</svg>
