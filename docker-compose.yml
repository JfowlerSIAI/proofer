services:
  ollama:
    # Pinned by digest, and never below background.js's OLLAMA_MIN_VERSION: the
    # setup page refuses an older engine. Ollama 0.35.0 includes the model-pull
    # digest validation fix; model verification after a pull cannot replace it.
    image: ollama/ollama:0.35.0@sha256:2a6e883b917fc543389599dae79918f5cac9e1438890506982f44aa4f5625d01
    ports:
      - "127.0.0.1:11434:11434"
    # Proofer uses its own scoped Origin rule; keep Ollama's default allowlist.
    volumes:
      - ollama:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:11434/api/version >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 20
    # Uncomment the following for GPU acceleration (requires nvidia-container-toolkit):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

volumes:
  ollama:
